[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = false
# The generated UltraHonk verifiers are large; optimize so they fit the
# EIP-170 24KB deploy limit.
optimizer = true
optimizer_runs = 200
# Tests read the committed proof fixtures.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/uniswap-hooks/lib/v4-core/",
    "@uniswap/v4-periphery/=lib/uniswap-hooks/lib/v4-periphery/",
    "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/src/",
    "@openzeppelin/contracts/=lib/uniswap-hooks/lib/openzeppelin-contracts/contracts/",
    "poseidon-solidity/=lib/poseidon-solidity/contracts/",
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
